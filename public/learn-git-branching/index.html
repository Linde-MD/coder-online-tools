<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Git 学习与练习 | Coder Online Tools Lab</title>
  <meta name="description" content="无需登录，在浏览器中交互式练习 Git 分支、合并、变基和远程协作。">
  <meta name="author" content="Peter Cottle">

  <link rel="icon" href="./assets/favicon-DXuu8THO.ico" type="image/x-icon">


  <!-- Templates from here on out... -->
  <script type="text/html" id="modal-view-template">
    <div class="contentHolder box vertical center flex1">
    </div>
  </script>

  <script type="text/html" id="terminal-window-bare-template">
    <div class="terminal-window-holder box flex10 vertical transitionTransform slideOut">
      <div class="wrapper box vertical">
        <div class="toolbar box vertical center">
          <div class="controls box horizontal justify">
            <div class="box flex1">
              <div
                class="close"
                aria-label="<%- closeWindowText %>"
                data-tooltip="<%- closeWindowText %>">
              </div>
            </div>
            <div class="box flex1">
              <div class="minimize">
              </div>
            </div>
            <div class="box flex1">
              <div class="plus">
              </div>
            </div>
          </div>
          <div>
            <i class="icon-cog"></i>
            <%= title %>
          </div>
        </div>
        <div class="terminal-text">
          <p class="helperText">
            <%= text %>
          </p>
        </div>
        <div class="inside box flex1">
        </div>
      </div>
    </div>
  </script>

  <script type="text/html" id="terminal-window-template">
    <div class="terminal-window box horizontal flex3 transitionAll">
    <div class="box flex3">
    </div>
    <div class="terminal-window-holder box flex10 vertical transitionTransform">
      <div class="wrapper box vertical">
        <div class="toolbar box vertical center">
          <div class="controls box horizontal justify">
            <div class="box flex1">
              <div
                class="close"
                aria-label="<%- closeWindowText %>"
                data-tooltip="<%- closeWindowText %>">
              </div>
            </div>
            <div class="box flex1">
              <div class="minimize">
              </div>
            </div>
            <div class="box flex1">
              <div class="plus">
              </div>
            </div>
          </div>
          <% if (title) { %>
            <div>
              <i class="icon-cog"></i>
              <span class="modal-title">
                <%= title %>
              </span>
            </div>
          <% } %>
        </div>

        <div class="inside">
        </div>
      </div>
    </div>

      <div class="box flex2">
      </div>
    </div>
  </script>

  <script type="text/html" id="level-dropdown-view">
    <div class="box horizontal center levelDropdownTabWrapper">
      <% for (var i = 0; i < tabs.length; i++) { %>
        <% if (tabs[i].id === selectedTab) { %>
          <div class="levelDropdownTab" data-id="<%=tabs[i].id%>">
        <% } else { %>
          <div class="levelDropdownTab deselected" data-id="<%=tabs[i].id%>">
        <% } %>
          <span data-id="<%=tabs[i].id%>">
            <%= tabs[i].name %>
          </span>
        </div>
      <% } %>
    </div>
    <div class="levelDropdownLoadStatus" role="status" aria-live="polite"></div>
  </script>

  <script type="text/html" id="series-view">
    <div class="displayName">
      <h3> <%= displayName %> </h3>
    </div>
    <p class="about">
      <%= about %>
    </p>
    <p class="levelInfo">
      <%= levelInfo %>
    </p>
    <div class="iconHolder box horizontal">
      <% for (var i = 0; i < ids.length; i++) { %>
        <a href="javascript:void(0)" class="levelIcon box center centerAlign vertical" id="levelIcon-<%=ids[i]%>" data-id="<%=ids[i]%>">
          <div class="index box" data-id="<%=ids[i]%>">
            <i class="icon-ok-circle" data-id="<%=ids[i]%>"></i>
            <i class="icon-star" data-id="<%=ids[i]%>"></i>
            <div class="indexNum" data-id="<%=ids[i]%>">
              <%= i + 1 %>
            </div>
          </div>
        </a>
      <% } %>
    </div>
  </script>

  <script type="text/html" id="git-demonstration-view">
    <div class="demonstrationText box vertical">
      <div class="beforeText">
        <p>
          <%= beforeHTML %>
        </p>
      </div>

      <div class="command center">
        <p class="uiButton uiButtonYellow transitionOpacity">
        <!--
          we strip aboveAll since its just an
          implementation detail for the UI and confusing
        -->
          <%= command.replace(' --aboveAll', '') %>
        </p>
        <p class="transitionOpacity" target="reset">
            Reset Animation
        </p>
      </div>

      <div class="afterText transitionOpacity">
        <p>
          <%= afterHTML %>
        </p>
      </div>
    </div>

    <div class="visHolder box vertical flex1">
      <div class="visHolderInside box flex1">
      </div>
    </div>
  </script>

  <script type="text/html" id="general-button">
      <%= buttonText %>
  </script>

  <script type="text/html" id="demonstration-builder">
    <div class="insideBuilder box vertical">
    </div>
    <div class="buttons box horizontal center">
      <div class="uiButton testButton">
        Test View
      </div>
    </div>
  </script>

  <script type="text/html" id="multi-view-builder">
    <div class="viewSoFar box vertical">
      <% if (!views.length) { %>
        <h3> You have no views specified yet! Add some with the buttons below </h3>
      <% } %>
      <% for (var i = 0; i < views.length; i++) { %>
        <div class="view box horizontal centerAlign justify">
          <div class="box horizontal">
            <div class="info">
              View
              #<%= i + 1 %>: <%= views[i].type %>
            </div>
          </div>
          <div class="singleViewButtons box horizontal">
            <button class="noStyle uiButton uiButtonRed box deleteButton" data-index="<%=i%>">
              Delete
            </button>
            <button class="noStyle uiButton uiButtonWhite box editButton" data-index="<%=i%>" data-type="<%= views[i].type %>">
              Edit
            </button>
            <button class="noStyle uiButton box testButton" data-index="<%=i%>">
              Test
            </button>
          </div>
        </div>
      <% } %>
    </div>
    <div class="buttons box horizontal center">
      <% for (var i = 0; i < supportedViews.length; i++) { %>
        <button class="noStyle uiButton addView uiButtonYellow" data-type="<%=supportedViews[i]%>">
        Add <%=supportedViews[i]%> View
        </button>
      <% } %>
    </div>
    <div class="controlsForView box horizontal center">
        <button class="noStyle uiButton uiButtonRed cancelView">
          Cancel
        </button>
        <% if (views.length) { %>
          <button class="noStyle uiButton uiButtonWhite testEntireView">
            Test Entire View
          </button>
          <button class="noStyle uiButton saveView">
            Save Entire View
          </button>
        <% } %>
   </div>
  </script>

  <script type="text/html" id="text-grabber">
    <p class="helperText">
      <%= helperText %>
    </p>
    <textarea></textarea>
  </script>

  <script type="text/html" id="markdown-presenter">
      <p class="helperText textAlignCenter">
        <%= previewText %>
      </p>
        <textarea><%= fillerText %></textarea>
  </script>

  <script type="text/html" id="markdown-grabber-view">
    <div class="inputSide box vertical">
      <div class="markdownGrabberInput">
        <textarea><%= fillerText %></textarea>
      </div>
    </div>

    <div class="box vertical flex1">
      <p class="helperText textAlignCenter">
        <%= previewText %>
      </p>

      <div class="markdownGrabberPreview box flex1 vertical">
        <div class="insidePreview">
        </div>
      </div>
    </div>
  </script>


  <script type="text/html" id="modal-alert-template">
    <h2>
      <%= title %>
    </h2>
    <p>
      <%= text %>
    </p>
  </script>

  <script type="text/html" id="interactive-rebase-template">
    <div class="iRebaseDialog wrapper transitionAllSlow">
      <p>
        Rebasing <%= num %> Commits
      </p>
      <% if (solutionOrder && solutionOrder.length) { %>
        <p class="solutionText">
          For the solution, order the commits as
            <%= solutionOrder.join(', ') %>. You may need to omit or pick commits.
        </p>
      <% } %>
      <p class="helperText">
        (Drag and drop to re-order. Toggle the "Omit/Pick" button to omit or re-add a commit)
      </p>
      <div class="entryHolders">
        <ul class="rebaseEntries">

        </ul>
      </div>

      <div class="confirmCancel">
      </div>
    </div>
  </script>

  <script type="text/html" id="left-right-template">
    <% if (!showLeft && lastNav ) { %>
      <div class="box right">
        <button class="noStyle"><i aria-hidden="true" class="icon-ok exit"></i><span class="visuallyHidden hoverLabel">OK</span></button>
      </div>
    <% } else { %>
      <% if (showLeft) { %>
        <div class="box left">
          <button class="noStyle"><i aria-hidden="true" class="icon-circle-arrow-left"></i><span class="visuallyHidden hoverLabel">Back</span></button>
      <% } else { %>
        <div class="box exit">
          <button class="noStyle"><i aria-hidden="true" class="icon-signout"></i><span class="visuallyHidden hoverLabel">Close</span></button>
      <% } %>
      </div>
      <div class="box right">
        <% if (!lastNav) { %>
          <button class="noStyle"><i aria-hidden="true" class="icon-circle-arrow-right"></i><span class="visuallyHidden hoverLabel">Next</span></button>
        <% } else { %>
          <button class="noStyle"><i aria-hidden="true"  class="icon-ok"></i><span class="visuallyHidden hoverLabel">OK</span></button>
        <% } %>
      </div>
    <% } %>
  </script>

  <script type="text/html" id="confirm-cancel-template">
    <% if (disableCancelButton) { %>
      <span></span>
    <% } else { %>
      <button class="noStyle box cancelButton uiButton uiButtonRed">
        <%= cancel %>
      </button>
    <% } %>
    <button class="noStyle box confirmButton uiButton uiButtonYellow">
      <%= confirm %>
    </button>
  </script>

  <script type="text/html" id="interactive-rebase-entry-template">
    <li id="<%= id %>" class="rebaseEntry transitionOpacity">
      <div class="wrapper">
        <i class="icon-align-justify"></i>
        <span class="idwrapper">
          <%= id %>
        </span>
        <button id="toggleButton" class="noStyle uiButton uiButtonPink">
          <span class="showWhenPicked">
            Click to Drop/Omit
          </span>
          <span class="showWhenNotPicked">
            Click to Include/Pick
          </span>
        </button>
      </div>
    </li>
  </script>

  <!-- Compiled static build for the interactive Git lessons. -->
  <script type="module" crossorigin src="./assets/index--rcVo7eB.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-BWaJ3C7D.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-Bp2VMoTq.js">
  <link rel="stylesheet" crossorigin href="./assets/index-BO5_SHuj.css">
  <style>
    html,
    body {
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: #3d3d3a;
      background: #faf9f5;
    }
    #commandLineBar,
    #terminal,
    .terminal-window .inside,
    .terminal-text,
    #prompt,
    #commandTextField {
      font-family: "JetBrains Mono", Consolas, monospace;
    }
    .modalView .inside,
    .seriesView,
    .seriesView * {
      font-family: "Manrope", "Segoe UI", sans-serif;
    }
    .seriesView p.levelInfo {
      font-family: "JetBrains Mono", Consolas, monospace;
    }
    #appLoading {
      background: #faf9f5 !important;
    }
    #appLoading:after {
      border-color: rgba(20, 20, 19, 0.14) !important;
      border-top-color: #cc785c !important;
    }
    .visBackgroundColor,
    div.gitDemonstrationView > div.visHolder {
      background: #f5f0e8 !important;
      background-color: #f5f0e8 !important;
    }
    div.toolbar {
      background: #efe9de;
      border-color: #d6cfc4;
      color: #252523;
    }
    div.toolbar > div.controls div.box.flex1 div {
      border: 0;
      box-shadow: none !important;
      transform: none;
    }
    div.toolbar > div.controls div.box.flex1 div.close {
      position: relative;
      width: 16px;
      height: 16px;
      margin: 0;
      border-radius: 5px;
      background: #cc785c !important;
      cursor: pointer;
      transition: background-color 120ms ease;
    }
    div.toolbar > div.controls div.box.flex1 div.close::after {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      content: "\00d7";
      font: 600 13px/1 "Manrope", "Segoe UI", sans-serif;
      text-indent: 0;
    }
    div.toolbar > div.controls div.box.flex1 div.close:hover {
      background: #a9583e !important;
    }
    div.toolbar > div.controls div.box.flex1:nth-child(2),
    div.toolbar > div.controls div.box.flex1:nth-child(3) {
      display: none;
    }
    div.toolbar > div.controls {
      width: 20px;
    }
    div.toolbar.level-toolbar {
      background: #e8e0d2;
      color: #252523;
    }
    div.toolbar.level-toolbar button,
    .uiButton {
      border: 1px solid #d6cfc4 !important;
      border-radius: 6px;
      background: #faf9f5 !important;
      background-image: none !important;
      box-shadow: none !important;
      color: #252523 !important;
      font-family: "Manrope", "Segoe UI", sans-serif;
      text-shadow: none;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    div.toolbar.level-toolbar button:hover,
    .uiButton:hover {
      border-color: #cc785c !important;
      background: #f5f0e8 !important;
      color: #252523 !important;
    }
    .uiButtonYellow {
      border-color: #cc785c !important;
      background: #cc785c !important;
      color: #fff !important;
    }
    .uiButtonYellow:hover {
      border-color: #a9583e !important;
      background: #a9583e !important;
      color: #fff !important;
    }
    .uiButtonPink,
    .uiButtonRed {
      border-color: #d6cfc4 !important;
      background: #e8e0d2 !important;
      color: #252523 !important;
    }
    div.levelDropdownTabWrapper {
      border-bottom-color: #d6cfc4;
    }
    div.levelDropdownTab {
      border-color: #d6cfc4;
      border-radius: 6px 6px 0 0;
      background: #efe9de;
      box-shadow: none;
      color: #252523;
    }
    div.levelDropdownTab.deselected {
      opacity: 0.72;
    }
    div.seriesView p.levelInfo,
    div.seriesView p.about {
      color: #5a554e;
      font-size: 13px;
      line-height: 1.5;
    }
    div.seriesView p.levelInfo {
      color: #6b5144;
    }
    div.displayName {
      border-bottom-color: #c9bdae;
      color: #252523;
    }
    a.levelIcon {
      border: 1px solid #d6cfc4;
      border-radius: 8px;
      background: #faf9f5 !important;
      background-image: none !important;
      box-shadow: none;
      color: #252523 !important;
      transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    a.levelIcon:hover {
      border-color: #cc785c;
      background: #f5f0e8 !important;
      background-image: none !important;
      transform: translateY(-1px);
    }
    a.levelIcon:active {
      background: #e8e0d2 !important;
      background-image: none !important;
      transform: translateY(0);
    }
    a.levelIcon.selected {
      border-color: #cc785c;
      box-shadow: 0 0 0 2px rgba(204, 120, 92, 0.2);
    }
    a.levelIcon.solved {
      border-color: #91b39a;
      background: #e6efe7 !important;
    }
    a.levelIcon.best {
      border-color: #cc785c;
      background: #f4e1d8 !important;
    }
    a.levelIcon div.index {
      color: #252523;
      font-weight: 600;
      text-shadow: none;
      -webkit-text-stroke: 0;
    }
    a.levelIcon div.index i {
      color: #a9583e;
    }
    #commandLineBar,
    .terminal-window .inside,
    li.rebaseEntry,
    #terminal {
      background: #efe9de;
      color: #252523;
    }
    #commandLineBar,
    #terminal,
    .terminal-window .inside,
    .terminal-text {
      color: #252523;
    }
    .modalView {
      background: rgba(61, 47, 36, 0.32);
    }
    .modalView .terminal-window-holder .inside,
    .modalView .terminal-window-holder .terminal-text {
      background: #faf9f5 !important;
      color: #252523;
    }
    .modalView a,
    .helperBar a {
      color: #a9583e;
    }
    .helperBar {
      border-color: #d6cfc4;
      background: #efe9de;
      color: #252523;
    }
    div.canvasTerminalHolder > div.terminal-window-holder div.terminal-text,
    div.canvasTerminalHolder > div.terminal-window-holder div.inside {
      background: #a9583e;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Shown only if startup takes a beat; removed once the app has rendered. -->
  <div id="appLoading" role="status">
    <span class="visuallyHidden">正在加载 Git 学习器…</span>
  </div>
  <style>#appLoading{position:fixed;inset:0;z-index:1000000;display:flex;align-items:center;justify-content:center;background:#5cbcfc;opacity:0;animation:appLoadingFadeIn .15s ease .25s forwards}#appLoading:after{content:"";width:28px;height:28px;border-radius:50%;border:3px solid rgba(0,0,0,.2);border-top-color:#222;animation:appLoadingSpin .7s linear infinite}@keyframes appLoadingFadeIn{to{opacity:1}}@keyframes appLoadingSpin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#appLoading:after{animation:none}}#appLoading[hidden]{display:none}#appLoading.appLoading-visible{opacity:1;animation:none}</style>

  <noscript>
    <div style="z-index:1000000;background:#cc785c;color:white;position:absolute;inset:0;padding:24px;">
      此 Git 学习工具需要启用 JavaScript。请启用后刷新页面。
    </div>
  </noscript>

  <!-- The entire interface is within this div -->
  <div id="interfaceWrapper" class="box horizontal flex1">
    <div id="controls" class="box vertical flex1 visBackgroundColor">
      <div id="commandLineHistory" class="box vertical flex3">
          <div class="toolbar box vertical center">
            <div class="controls box horizontal justify">
              <div class="box flex1">
                <div class="close">
                </div>
              </div>
              <div class="box flex1">
                <div class="minimize">
                </div>
              </div>
              <div class="box flex1">
                <div class="plus">
                </div>
              </div>
            </div>
            <div>
              <label for="commandTextField">
                <i aria-hidden="true" class="icon-home"></i>
                <span class="visuallyHidden">Terminal &ndash;</span>
                <span class="vcs-mode-aware intl-aware" data-intl="learn-git-branching">
                  Learn Git Branching
                </span>
              </label>
            </div>
          </div>
          <div id="levelToolbarMount">
          </div>

        <div id="terminal" class="box flex1 horizontal startAlign">
          <div id="commandDisplay" class="box vertical flex1">
          </div>
        </div>

        <div id="commandLineBar" class="box vertical flex0">
          <div id="prompt" class="">
            <span class="promptSign box">$</span>
            <span class="cursor box">&nbsp;</span>
            <p class="command"></p>
            <div id="shadow"></div>
          </div>
          <textarea
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            id="commandTextField"></textarea>
        </div>

      </div>
    </div>

    <div id="mainVisSpace" class="box flex2 horizontal transitionAll visBackgroundColor">
      <span class="modeText transitionOpacity gitMode">
        Git
      </span>
      <span class="modeText transitionOpacity hgMode">
        Hg
      </span>
    </div>

    <!-- If you drag the goal window to the right side of the screen, this gets shown and causes
         the main visualization to squeeze a bit. This way, you could have the goal window hang out
         on the right side of the screen and still see the repo visualization. -->
    <div id="goalPlaceholder" class="box flex1 visBackgroundColor" style="display: none;"></div>

  </div>

  <div id="canvasHolder">
  </div>

  <div id="reactMount">
  </div>

  <div id="helperBarMount">
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coder Online Tools Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
</head>
<body class="theme-warm-editorial">

<div class="feature-nav-wrap shadow-sm">
    <div id="feature-nav" class="feature-nav container-xl py-2 d-flex gap-2 align-items-center">
        <div class="brand-sigil" aria-hidden="true">*</div>
        <div class="brand-name me-auto">Coder Online Tools Lab</div>
        <button id="btn-feature-chart" class="feature-tab btn btn-sm btn-primary active" type="button">曲线图</button>
        <button id="btn-feature-j1939" class="feature-tab btn btn-sm btn-outline-primary" type="button">J1939 PGN/ID互转</button>
    </div>
</div>

<section id="feature-chart" class="feature-panel active">

<div id="chart-config-panel" class="chart-config-panel mt-3">
    <div class="chart-config-inner container-xl">
        <div class="settings-panels">
            <section class="settings-panel">
                <div class="settings-panel-head">
                    <div class="settings-panel-head-main">
                        <h2 class="settings-panel-title">画布与显示</h2>
                        <p class="settings-panel-note">控制图尺寸、可见元素和整体视觉风格。</p>
                    </div>
                    <button type="button" class="settings-collapse-btn collapse-triangle-btn" aria-label="折叠面板" aria-expanded="true"></button>
                </div>
                <div class="settings-panel-body">

                <div class="settings-subcard">
                    <div class="settings-subtitle">尺寸与显示项</div>
                    <div class="row g-3 align-items-end">
                        <div class="col-6 col-md-3 col-lg-2">
                            <label for="input-width" class="form-label mb-1">宽度</label>
                            <input id="input-width" type="number" min="200" max="2000" class="form-control form-control-sm" value="800">
                        </div>
                        <div class="col-6 col-md-3 col-lg-2">
                            <label for="input-height" class="form-label mb-1">高度</label>
                            <input id="input-height" type="number" min="200" max="2000" class="form-control form-control-sm" value="800">
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <div class="form-check form-switch mt-2 settings-display-switch">
                                <input id="input-showMaxGuideLines" class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label" for="input-showMaxGuideLines">显示最大值虚线</label>
                            </div>
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <div class="form-check form-switch mt-2 settings-display-switch">
                                <input id="input-showGrid" class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label" for="input-showGrid">显示背景网格</label>
                            </div>
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <div class="form-check form-switch mt-2 settings-display-switch">
                                <input id="input-showPoints" class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label" for="input-showPoints">显示点</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="settings-subcard mt-3">
                    <div class="settings-subtitle">图像配色</div>
                    <div class="row g-3 align-items-end">
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="input-bgcolor" class="form-label mb-1">背景色</label>
                            <input id="input-bgcolor" type="color" class="form-control form-control-color" value="#fffdf9">
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="input-axis-color" class="form-label mb-1">坐标轴色</label>
                            <input id="input-axis-color" type="color" class="form-control form-control-color" value="#3d3d3a">
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="input-tick-color" class="form-label mb-1">刻度字色</label>
                            <input id="input-tick-color" type="color" class="form-control form-control-color" value="#6c6a64">
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="input-grid-color" class="form-label mb-1">网格线色</label>
                            <input id="input-grid-color" type="color" class="form-control form-control-color" value="#d8d0c4">
                        </div>
                        <div class="col-6 col-md-4 col-lg-2">
                            <label for="input-guide-color" class="form-label mb-1">最大值线色</label>
                            <input id="input-guide-color" type="color" class="form-control form-control-color" value="#8e8b82">
                        </div>
                    </div>
                </div>
                </div>
            </section>

            <section class="settings-panel">
                <div class="settings-panel-head">
                    <div class="settings-panel-head-main">
                        <h2 class="settings-panel-title">曲线数据</h2>
                        <p class="settings-panel-note">按曲线组管理：组内同图绘制，组间分图绘制。</p>
                    </div>
                    <button type="button" class="settings-collapse-btn collapse-triangle-btn" aria-label="折叠面板" aria-expanded="true"></button>
                </div>
                <div class="settings-panel-body">

                <div id="curve-list"></div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="btn-add-curve-group" class="btn btn-outline-primary" type="button">+ 添加曲线组</button>
                    <button id="btn-re-render" class="btn btn-success" type="button">重新生成曲线</button>
                </div>
                </div>
            </section>
        </div>
    </div>
</div>
<div id="chart-svg-container" class="flex-center mb-200 container-xl">
    <div id="svg-resize-wrapper" class="svg-resize-wrapper">
        <!-- SVG将由chart-renderer动态插入到此div内 -->
    </div>
</div>
</section>

<div id="formula-editor-modal" class="formula-modal" aria-hidden="true">
    <div class="formula-modal-card" role="dialog" aria-modal="true" aria-labelledby="formula-editor-title">
        <div class="formula-modal-title" id="formula-editor-title">公式编辑器（JS 箭头匿名函数）</div>
        <div class="formula-modal-tip">请填写单个箭头函数，例如 (x) =&gt; { return x; }，支持 Tab 缩进。</div>
        <div id="formula-code-editor" class="formula-code-editor"></div>
        <textarea id="textarea-formula-code" class="formula-textarea" style="display:none;"></textarea>
        <div id="formula-editor-error" class="formula-editor-error"></div>
        <div class="formula-modal-actions">
            <button id="btn-formula-cancel" class="btn" type="button">取消</button>
            <button id="btn-formula-save" class="btn btn-success" type="button">保存并应用</button>
        </div>
    </div>
</div>

<section id="feature-j1939" class="feature-panel">
    <div class="j1939-panel container-xl">
        <div class="j1939-grid">
            <div class="j1939-card card shadow-sm border-0">
                <div class="card-body">
                <div class="j1939-card-title card-title h5">ID 转 PGN</div>
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-6">
                        <label for="input-j1939-id" class="form-label mb-1">29位ID</label>
                        <input id="input-j1939-id" class="form-control form-control-sm" type="text" value="0x18E1F3EF" placeholder="支持十进制或0x十六进制">
                    </div>
                    <div class="col-auto">
                        <button id="btn-convert-id" class="btn btn-outline-primary" type="button">转换</button>
                    </div>
                </div>
                <div id="id-to-pgn-result" class="j1939-result"></div>
                </div>
            </div>

            <div class="j1939-card card shadow-sm border-0">
                <div class="card-body">
                <div class="j1939-card-title card-title h5">PGN 转 ID</div>
                <div class="j1939-form-grid">
                    <label for="input-j1939-pgn">PGN</label>
                    <input id="input-j1939-pgn" class="form-control form-control-sm" type="text" value="65043" placeholder="支持十进制或0x十六进制">

                    <label for="input-j1939-priority">优先级 P (0-7)</label>
                    <input id="input-j1939-priority" class="form-control form-control-sm" type="number" min="0" max="7" value="3">

                    <label for="input-j1939-sa">源地址 SA (0-255)</label>
                    <input id="input-j1939-sa" class="form-control form-control-sm" type="text" value="131">

                    <label for="input-j1939-da">目的地址 DA (0-255)</label>
                    <input id="input-j1939-da" class="form-control form-control-sm" type="text" value="0x27">
                </div>
                <div id="pgn-validation-msg" class="j1939-validation"></div>
                <div class="mt-12">
                    <button id="btn-convert-pgn" class="btn btn-success" type="button">转换</button>
                </div>
                <div id="pgn-to-id-result" class="j1939-result mt-12"></div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>

<script type="module" src="/src/main.js"></script>

</html>
